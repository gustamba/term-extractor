<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrator de Termos</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.2/mammoth.browser.min.js"></script>
</head>
<body>
    <main class="container">
        <h1>Extrator de Termos</h1>
        <p class="subtitle">Extraia termos ou converta documentos Word em planilhas Excel.</p>

        <form id="uploadForm">
            <label for="operation">O que deseja fazer?</label>
            <select id="operation">
                <option value="extract">Extrair termos do documento</option>
                <option value="convert">Converter DOCX completo para XLSX</option>
            </select>

            <div id="extractionOptions">
                <label for="extractionType">Tipo de extração:</label>
                <select id="extractionType">
                    <option value="quotes">Termos entre aspas</option>
                    <option value="capslock">Palavras em CAIXA ALTA</option>
                </select>
            </div>

            <label for="fileInput">Selecione seu arquivo .docx:</label>
            <input type="file" id="fileInput" accept=".docx" required>
            <p class="hint">O arquivo será processado localmente no seu navegador.</p>

            <button id="submitButton" type="submit">Extrair termos</button>
        </form>

        <div id="status" role="status" aria-live="polite"></div>
        <a id="downloadLink" class="download-link" style="display:none;">Baixar arquivo XLSX</a>
    </main>
    <script src="script.js"></script>
</body>
</html>
