<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrator de Termos</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.2/mammoth.browser.min.js"></script>
</head>
<body>
    <main class="container">
        <h1>Extrator de Termos</h1>
        <p class="subtitle">Extraia termos entre aspas ou em CAIXA ALTA de documentos Word.</p>
        <form id="uploadForm">
            <label for="extractionType">Tipo de extração:</label>
            <select id="extractionType" name="extractionType">
                <option value="quotes">Termos entre aspas</option>
                <option value="capslock">Palavras em CAIXA ALTA</option>
            </select>
            <label for="fileInput">Selecione seu arquivo .docx:</label>
            <input
                type="file"
                id="fileInput"
                name="fileInput"
                accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
                required
            >
            <button id="submitButton" type="submit">Extrair termos</button>
        </form>
        <div id="status" role="status" aria-live="polite"></div>
    </main>
    <script src="script.js?v=2"></script>
</body>
</html>
